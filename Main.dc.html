<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EdgeBar flyout</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
input[type=range]{width:100%;accent-color:#2D6A5F;margin:0}
</style>
</helmet>
<div style="width:360px;height:600px;box-sizing:border-box;padding:24px 24px 20px;background:#FBFAF8;color:#1B1B19;font-family:Geist,system-ui,sans-serif;display:flex;flex-direction:column;gap:22px">

  <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Sidewise</span>
    <span style="font-size: 12px; color: rgb(110, 108, 102)">Touchpad ready</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="position:relative;height:200px;box-sizing:border-box;border:1px solid #CFCBC3;border-radius:18px;background:#E9E8E4;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -2px 6px rgba(0,0,0,0.06)">

      <div style="position:absolute;left:-12%;top:-30%;width:70%;height:70%;border-radius:50%;background:#FFFFFF;opacity:0.55;filter:blur(36px);pointer-events:none"></div>

      <div style="position:absolute;left:0;top:0;bottom:0;width:{{ zoneW }}px;box-sizing:border-box;border-right:1px solid rgba(0,0,0,0.05);box-shadow:inset 6px 0 10px -6px rgba(0,0,0,0.12)">
        <div style="position:absolute;left:0;right:0;bottom:0;height:{{ briPx }}px;background:rgba(45,106,95,0.16)"></div>
        <div style="position:absolute;left:0;right:0;bottom:{{ briPx }}px;height:2px;background:#2D6A5F;box-shadow:0 0 8px rgba(45,106,95,0.55)"></div>
        <div style="position:absolute;left:calc(50% - 6px);top:{{ briDot }}px;width:12px;height:12px;border-radius:50%;background:#2D6A5F;box-shadow:0 0 0 4px rgba(45,106,95,0.18),0 0 12px rgba(45,106,95,0.5),0 1px 2px rgba(0,0,0,0.25)"></div>
        <span style="position:absolute;left:0;right:0;top:12px;text-align:center;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#3A3935;font-variant-numeric:tabular-nums">{{ briLabel }}</span>
      </div>

      <div style="position:absolute;right:0;top:0;bottom:0;width:{{ zoneW }}px;box-sizing:border-box;border-left:1px solid rgba(0,0,0,0.05);box-shadow:inset -6px 0 10px -6px rgba(0,0,0,0.12)">
        <div style="position:absolute;left:0;right:0;bottom:0;height:{{ volPx }}px;background:rgba(45,106,95,0.16)"></div>
        <div style="position:absolute;left:0;right:0;bottom:{{ volPx }}px;height:2px;background:#2D6A5F;box-shadow:0 0 8px rgba(45,106,95,0.55)"></div>
        <div style="position:absolute;left:calc(50% - 6px);top:{{ volDot }}px;width:12px;height:12px;border-radius:50%;background:#2D6A5F;box-shadow:0 0 0 4px rgba(45,106,95,0.18),0 0 12px rgba(45,106,95,0.5),0 1px 2px rgba(0,0,0,0.25)"></div>
        <span style="position:absolute;left:0;right:0;top:12px;text-align:center;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#3A3935;font-variant-numeric:tabular-nums">{{ volLabel }}</span>
      </div>

      <div style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:11px;color:#8A877F;letter-spacing:0.02em">Slide an edge</div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#6E6C66">
      <span>Brightness</span>
      <span>Volume</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;border-top:1px solid #E4E1DA">
    <button onClick="{{ hapticNext }}" style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;background:none;border:0;border-bottom:1px solid #E4E1DA;cursor:pointer;text-align:left">
      <span style="font-size:14px">Haptic feedback</span>
      <span style="font-size:13px;color:#2D6A5F;font-weight:500">{{ haptic }}</span>
    </button>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #E4E1DA">
      <span style="font-size:14px">Quick mute</span>
      <button role="switch" aria-checked="{{ qm }}" aria-label="Quick mute" onClick="{{ tQm }}" style="width:36px;height:20px;padding:2px;border:0;border-radius:10px;background:{{ qmBg }};display:flex;justify-content:{{ qmJustify }};cursor:pointer">
        <span style="width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,0.18)"></span>
      </button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #E4E1DA">
      <span style="font-size:14px">Media strip</span>
      <button role="switch" aria-checked="{{ ms }}" aria-label="Media strip" onClick="{{ tMs }}" style="width:36px;height:20px;padding:2px;border:0;border-radius:10px;background:{{ msBg }};display:flex;justify-content:{{ msJustify }};cursor:pointer">
        <span style="width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,0.18)"></span>
      </button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <label style="display:flex;flex-direction:column;gap:8px">
      <span style="display:flex;justify-content:space-between;font-size:13px"><span>Sensitivity</span><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#6E6C66">{{ sens }}</span></span>
      <input type="range" min="0" max="100" value="{{ sens }}" onInput="{{ onSens }}">
    </label>
    <label style="display:flex;flex-direction:column;gap:8px">
      <span style="display:flex;justify-content:space-between;font-size:13px"><span>Edge width</span><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#6E6C66">{{ edge }}</span></span>
      <input type="range" min="4" max="20" value="{{ edge }}" onInput="{{ onEdge }}">
    </label>
  </div>

  <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px">
    <a href="Settings.dc.html" style="color:#1B1B19;text-decoration:none;font-weight:500">Settings</a>
    <span style="color:#6E6C66">Quit</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const g = (k, d) => (s[k] !== undefined ? s[k] : d);
    const flip = (k, d) => () => this.setState({ [k]: !g(k, d) });
    const order = ['Off', 'Light', 'Medium', 'Strong'];
    const hapticNext = () => {
      const cur = g('haptic', 'Medium');
      this.setState({ haptic: order[(order.indexOf(cur) + 1) % order.length] });
    };
    const qm = g('qm', true), ms = g('ms', false);
    const bri = g('bri', 64), vol = g('vol', 40);
    const sens = g('sens', 50), edge = g('edge', 8);
    const pad = 200;
    const level = (v) => Math.round((v / 100) * pad);
    const dot = (v) => pad - level(v) - 6;
    return {
      zoneW: edge * 8,
      briPx: level(bri), briDot: dot(bri), briLabel: bri + '%',
      volPx: level(vol), volDot: dot(vol), volLabel: vol + '%',
      haptic: g('haptic', 'Medium'), hapticNext,
      qm, qmBg: qm ? '#2D6A5F' : '#D9D5CC', qmJustify: qm ? 'flex-end' : 'flex-start', tQm: flip('qm', true),
      ms, msBg: ms ? '#2D6A5F' : '#D9D5CC', msJustify: ms ? 'flex-end' : 'flex-start', tMs: flip('ms', false),
      sens, edge,
      onSens: (e) => this.setState({ sens: +e.target.value }),
      onEdge: (e) => this.setState({ edge: +e.target.value })
    };
  }
}
</script>
</body>
</html>
