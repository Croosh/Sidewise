[package]
name = "sidewise-ui"
version = "0.1.0"
edition = "2021"
description = "UI layer for Sidewise: Tray icon, Flyout, Settings, and Setup Guide"

[dependencies]
sidewise-core = { path = "../sidewise-core" }
sidewise-win = { path = "../sidewise-win" }
crossbeam-channel = "0.5"
tracing = "0.1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
]
